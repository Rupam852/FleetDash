name: FleetDash CI Pipeline

on:
  push:
    branches: [ main, 'member-*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Typecheck (Zero Any Policy)
        run: npm run build

      - name: Run Unit Tests
        run: npm run test --if-present

